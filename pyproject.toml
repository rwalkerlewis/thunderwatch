[project]
name = "thunderwatch"
version = "0.1.0"
description = "Thunderstorm cell and lightning threat nowcasting for a coordinate"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
glm = ["netCDF4"]

[project.scripts]
thunder-watch = "thunder_watch:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["thunder_watch"]
